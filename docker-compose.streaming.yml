# Opt in with -f docker-compose.yml -f docker-compose.streaming.yml.
# Startup/migrations are operator actions. This file is not applied automatically.
services:
  api:
    environment:
      RELAYRTC_STREAMING_ENABLED: "true"
      STREAMING_SIGNING_SECRET: ${STREAMING_SIGNING_SECRET:?Set a distinct streaming signing secret}
      STREAMING_WORKER_KEY: ${STREAMING_WORKER_KEY:?Set a distinct streaming worker key}
      STREAMING_GATEWAY_KEY: ${STREAMING_GATEWAY_KEY:?Set a distinct streaming gateway key}
      STREAMING_PUBLIC_ORIGIN: ${STREAMING_PUBLIC_ORIGIN:-http://localhost:8080}
      STREAMING_GATEWAY_API_ORIGIN: http://streaming-gateway:9997
      STREAMING_GATEWAY_WHIP_ORIGIN: http://streaming-gateway:8889
      STREAMING_GATEWAY_HLS_ORIGIN: http://streaming-gateway:8888
      STREAMING_GATEWAY_RTSP_ORIGIN: rtsp://streaming-gateway:8554
      STREAMING_PUBLIC_RTMP_ORIGIN: ${STREAMING_PUBLIC_RTMP_ORIGIN:-rtmp://localhost:1935}
      STREAMING_WORKER_RTP_IP: 172.30.0.20
      STREAMING_S3_ENDPOINT: http://streaming-storage:9000
      STREAMING_S3_BUCKET: ${STREAMING_S3_BUCKET:-relayrtc-streaming}
      STREAMING_S3_REGION: us-east-1
      STREAMING_S3_ACCESS_KEY: ${STREAMING_S3_ACCESS_KEY:?Set the API storage access key}
      STREAMING_S3_SECRET_KEY: ${STREAMING_S3_SECRET_KEY:?Set the API storage secret key}
      STREAMING_ALLOWED_ORIGINS: ${STREAMING_ALLOWED_ORIGINS:-http://localhost:3002,http://localhost:3005,http://127.0.0.1:3002}
      STREAMING_MAX_SESSIONS: ${STREAMING_MAX_SESSIONS:-8}
      STREAMING_MAX_STREAMS_PER_ENVIRONMENT: ${STREAMING_MAX_STREAMS_PER_ENVIRONMENT:-100}
      STREAMING_DESTINATION_ENCRYPTION_KEY: ${STREAMING_DESTINATION_ENCRYPTION_KEY:?Set a separate destination encryption key}
      STREAMING_SOURCE_ALLOWED_HOSTS: ${STREAMING_SOURCE_ALLOWED_HOSTS:-}
      STREAMING_MAX_SOURCE_JOBS: ${STREAMING_MAX_SOURCE_JOBS:-4}
      STREAMING_MAX_SCHEDULES: ${STREAMING_MAX_SCHEDULES:-1000}
      STREAMING_MAX_SCHEDULES_PER_ENVIRONMENT: ${STREAMING_MAX_SCHEDULES_PER_ENVIRONMENT:-100}
      STREAMING_SCHEDULE_NOTIFICATIONS_ENABLED: ${STREAMING_SCHEDULE_NOTIFICATIONS_ENABLED:-false}
      STREAMING_MIXERS_ENABLED: ${STREAMING_MIXERS_ENABLED:-true}
      STREAMING_MAX_MIXERS: ${STREAMING_MAX_MIXERS:-2}
      STREAMING_MAX_MIXERS_PER_ENVIRONMENT: ${STREAMING_MAX_MIXERS_PER_ENVIRONMENT:-1}
      STREAMING_MAX_CLIP_JOBS: ${STREAMING_MAX_CLIP_JOBS:-4}
      STREAMING_MAX_CLIPS_PER_MINUTE: ${STREAMING_MAX_CLIPS_PER_MINUTE:-10}
      STREAMING_MAX_CLIP_DURATION_SECONDS: ${STREAMING_MAX_CLIP_DURATION_SECONDS:-120}
      STREAMING_GUESTS_ENABLED: ${STREAMING_GUESTS_ENABLED:-true}
      STREAMING_GUEST_SIGNALING_URL: ${STREAMING_GUEST_SIGNALING_URL:-ws://localhost:8081/v1/connect}
      STREAMING_DVR_ENABLED: ${STREAMING_DVR_ENABLED:-true}
      STREAMING_MAX_BUFFERS_PER_ENVIRONMENT: ${STREAMING_MAX_BUFFERS_PER_ENVIRONMENT:-2}
      STREAMING_MAX_BUFFERS: ${STREAMING_MAX_BUFFERS:-4}
      STREAMING_MAX_RECORDINGS: ${STREAMING_MAX_RECORDINGS:-4}
      STREAMING_MAX_RECORDINGS_PER_ENVIRONMENT: ${STREAMING_MAX_RECORDINGS_PER_ENVIRONMENT:-2}
      STREAMING_MAX_RECORDING_BYTES: ${STREAMING_MAX_RECORDING_BYTES:-536870912}
      STREAMING_MAX_DESTINATIONS: ${STREAMING_MAX_DESTINATIONS:-8}
      STREAMING_MAX_EGRESS_BITRATE: ${STREAMING_MAX_EGRESS_BITRATE:-24000000}
      STREAMING_MAX_EGRESS_BYTES: ${STREAMING_MAX_EGRESS_BYTES:-20000000000}
      STREAMING_BROADCASTS_ENABLED: ${STREAMING_BROADCASTS_ENABLED:-true}
      STREAMING_MAX_BROADCASTS: ${STREAMING_MAX_BROADCASTS:-16}
      STREAMING_MAX_BROADCASTS_PER_ENVIRONMENT: ${STREAMING_MAX_BROADCASTS_PER_ENVIRONMENT:-4}
      STREAMING_MAX_OUTPUT_JOBS: ${STREAMING_MAX_OUTPUT_JOBS:-16}
      STREAMING_MAX_OUTPUT_JOBS_PER_WORKER: ${STREAMING_MAX_OUTPUT_JOBS_PER_WORKER:-4}
    depends_on:
      streaming-storage-init:
        condition: service_completed_successfully

  streaming-storage:
    build:
      context: .
      dockerfile: infrastructure/docker/streaming-storage.Dockerfile
      target: runner
    environment:
      MINIO_ROOT_USER: ${STREAMING_STORAGE_ROOT_USER:?Set the storage administrator username}
      MINIO_ROOT_PASSWORD: ${STREAMING_STORAGE_ROOT_PASSWORD:?Set the storage administrator password}
    volumes:
      - streaming-data:/data
    networks: [relayrtc]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]

  streaming-storage-init:
    build:
      context: .
      dockerfile: infrastructure/docker/streaming-storage.Dockerfile
      target: storage-init
    environment:
      MINIO_ROOT_USER: ${STREAMING_STORAGE_ROOT_USER:?Set the storage administrator username}
      MINIO_ROOT_PASSWORD: ${STREAMING_STORAGE_ROOT_PASSWORD:?Set the storage administrator password}
      STREAMING_S3_BUCKET: ${STREAMING_S3_BUCKET:-relayrtc-streaming}
      STREAMING_S3_ACCESS_KEY: ${STREAMING_S3_ACCESS_KEY:?Set the API storage access key}
      STREAMING_S3_SECRET_KEY: ${STREAMING_S3_SECRET_KEY:?Set the API storage secret key}
    depends_on:
      streaming-storage:
        condition: service_healthy
    networks: [relayrtc]
    restart: "no"

  streaming-gateway:
    image: bluenviron/mediamtx:1.21.2
    environment:
      MTX_AUTHHTTPADDRESS: http://gateway:${STREAMING_GATEWAY_KEY:?Set gateway key}@api:8080/internal/v1/streaming/gateway-auth
      # The private API proxies HLS with this credential; browsers use scoped API grants.
      MTX_HLSCDNSECRET: ${STREAMING_GATEWAY_KEY:?Set gateway key}
      MTX_WEBRTCADDITIONALHOSTS: ${STREAMING_WEBRTC_HOSTS:-127.0.0.1}
      MTX_RTMPENCRYPTION: ${STREAMING_RTMP_ENCRYPTION:-no}
    volumes:
      - ./infrastructure/streaming/mediamtx.yml:/mediamtx.yml:ro
      - ${STREAMING_CERTS_DIRECTORY:-./.streaming/certs}:/certs:ro
    ports:
      - ${STREAMING_INGEST_BIND:-127.0.0.1}:1935:1935
      - ${STREAMING_INGEST_BIND:-127.0.0.1}:1936:1936
      - ${STREAMING_INGEST_BIND:-127.0.0.1}:8189:8189/udp
    networks: [relayrtc]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    security_opt: [no-new-privileges:true]

  streaming-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/streaming.Dockerfile
      target: runner
    environment:
      STREAMING_API_ORIGIN: http://api:8080
      STREAMING_WORKER_KEY: ${STREAMING_WORKER_KEY:?Set worker key}
      STREAMING_WORKER_ID: streaming-local-1
      STREAMING_WORKER_CONCURRENCY: ${STREAMING_WORKER_CONCURRENCY:-4}
      STREAMING_RTP_PORT_BASE: 20000
    networks:
      relayrtc:
      rtc-internal:
        ipv4_address: 172.30.0.20
    depends_on:
      api:
        condition: service_healthy
        restart: true
      streaming-gateway:
        condition: service_started
      media:
        condition: service_healthy
        restart: true
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    cpus: ${STREAMING_WORKER_CPUS:-4}
    mem_limit: ${STREAMING_WORKER_MEMORY:-4g}
    pids_limit: 256
    security_opt: [no-new-privileges:true]

  streaming-outputs:
    build:
      context: .
      dockerfile: infrastructure/docker/streaming.Dockerfile
      target: runner
    command: [node, --enable-source-maps, services/streaming/dist/output-server.js]
    environment:
      STREAMING_API_ORIGIN: http://api:8080
      STREAMING_WORKER_KEY: ${STREAMING_WORKER_KEY:?Set worker key}
      STREAMING_WORKER_ID: streaming-outputs-1
      STREAMING_OUTPUT_CONCURRENCY: ${STREAMING_OUTPUT_CONCURRENCY:-4}
      STREAMING_HEALTH_PORT: 8091
    networks: [relayrtc]
    depends_on:
      api:
        condition: service_healthy
        restart: true
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    cpus: 1
    mem_limit: 2g
    pids_limit: 256
    security_opt: [no-new-privileges:true]

  streaming-sources:
    build:
      context: .
      dockerfile: infrastructure/docker/streaming.Dockerfile
      target: runner
    command: [node, --enable-source-maps, services/streaming/dist/restream-server.js]
    environment:
      STREAMING_API_ORIGIN: http://api:8080
      STREAMING_WORKER_KEY: ${STREAMING_WORKER_KEY:?Set worker key}
      STREAMING_WORKER_ID: streaming-sources-1
      STREAMING_HEALTH_PORT: 8093
    networks: [relayrtc]
    depends_on:
      api:
        condition: service_healthy
        restart: true
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    cpus: 1
    mem_limit: 1g
    pids_limit: 128
    read_only: true
    tmpfs:
      - "/tmp:size=64m,mode=1777"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  streaming-recordings:
    build:
      context: .
      dockerfile: infrastructure/docker/streaming.Dockerfile
      target: runner
    command: [node, --enable-source-maps, services/streaming/dist/recording-server.js]
    environment:
      STREAMING_API_ORIGIN: http://api:8080
      STREAMING_WORKER_KEY: ${STREAMING_WORKER_KEY:?Set worker key}
      STREAMING_WORKER_ID: streaming-recordings-1
      TMPDIR: /tmp/recordings
      STREAMING_HEALTH_PORT: 8092
    tmpfs:
      - /tmp/recordings:size=768m,mode=1777
    networks: [relayrtc]
    depends_on:
      api:
        condition: service_healthy
        restart: true
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    cpus: 1
    mem_limit: 2g
    pids_limit: 256
    security_opt: [no-new-privileges:true]

  prometheus:
    volumes:
      - ./infrastructure/prometheus/streaming.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/prometheus/streaming.rules.yml:/etc/prometheus/streaming.rules.yml:ro
      - ./.streaming/worker-key:/run/secrets/streaming-worker-key:ro
      - ./.streaming/gateway-key:/run/secrets/streaming-gateway-key:ro

volumes:
  streaming-data:
