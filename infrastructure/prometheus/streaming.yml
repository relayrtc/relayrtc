global:
  scrape_interval: 10s
  evaluation_interval: 10s
  scrape_timeout: 5s
rule_files:
  - /etc/prometheus/relayrtc.rules.yml
  - /etc/prometheus/streaming.rules.yml
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: coturn
    static_configs:
      - targets: [coturn:9641]
  - job_name: streaming-runtime
    metrics_path: /internal/v1/streaming/metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/streaming-worker-key
    static_configs:
      - targets: [api:8080]
  - job_name: streaming-worker
    static_configs:
      - targets: [streaming-worker:8090]
  - job_name: streaming-outputs
    static_configs:
      - targets: [streaming-outputs:8091]
  - job_name: streaming-recordings
    static_configs:
      - targets: [streaming-recordings:8092]
  - job_name: streaming-gateway
    authorization:
      type: Bearer
      credentials_file: /run/secrets/streaming-gateway-key
    static_configs:
      - targets: [streaming-gateway:9998]
  - job_name: streaming-sources
    static_configs:
      - targets: [streaming-sources:8093]
