# Apply after the base, streaming and base release files. Each worker role uses
# the same streaming image; its command/resources remain in the streaming file.
services:
  streaming-worker:
    image: relayrtc/streaming:${RELAYRTC_VERSION:-0.1.4}
  streaming-outputs:
    image: relayrtc/streaming:${RELAYRTC_VERSION:-0.1.4}
  streaming-sources:
    image: relayrtc/streaming:${RELAYRTC_VERSION:-0.1.4}
  streaming-recordings:
    image: relayrtc/streaming:${RELAYRTC_VERSION:-0.1.4}
  streaming-storage:
    image: relayrtc/streaming-storage:${RELAYRTC_VERSION:-0.1.4}
  streaming-storage-init:
    image: relayrtc/streaming-storage-init:${RELAYRTC_VERSION:-0.1.4}
