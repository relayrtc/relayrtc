name: Publish container images

on:
  workflow_dispatch:
    inputs:
      version:
        description: Image version to publish from the selected branch
        required: true
        default: "0.1.3"
        type: string
      image:
        description: Image to publish. Use all for a complete release
        required: true
        default: all
        type: choice
        options:
          - all
          - setup
          - api
          - signaling
          - media
          - streaming
          - streaming-storage
          - streaming-storage-init
          - console
          - migrate
          - coturn
          - prometheus
          - grafana
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select:
    name: Selecting images to publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.images.outputs.image }}
      matrix: ${{ steps.images.outputs.matrix }}
    steps:
      - name: Selecting the service build matrix
        id: images
        env:
          REQUESTED_IMAGE: ${{ inputs.image }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const images = [
            { name: 'api', context: '.', dockerfile: 'infrastructure/docker/api.Dockerfile', target: 'runner' },
            { name: 'signaling', context: './services/signaling', dockerfile: 'services/signaling/Dockerfile', target: '' },
            { name: 'streaming', context: '.', dockerfile: 'infrastructure/docker/streaming.Dockerfile', target: 'runner' },
            { name: 'streaming-storage', context: '.', dockerfile: 'infrastructure/docker/streaming-storage.Dockerfile', target: 'runner' },
            { name: 'streaming-storage-init', context: '.', dockerfile: 'infrastructure/docker/streaming-storage.Dockerfile', target: 'storage-init' },
            { name: 'console', context: '.', dockerfile: 'infrastructure/docker/console.Dockerfile', target: 'runner' },
            { name: 'migrate', context: '.', dockerfile: 'infrastructure/docker/migrate.Dockerfile', target: 'migrator' },
            { name: 'coturn', context: '.', dockerfile: 'infrastructure/docker/coturn.Dockerfile', target: '' },
            { name: 'prometheus', context: '.', dockerfile: 'infrastructure/docker/prometheus.Dockerfile', target: '' },
            { name: 'grafana', context: '.', dockerfile: 'infrastructure/docker/grafana.Dockerfile', target: '' },
          ];
          const image = process.env.EVENT_NAME === 'push' ? 'all' : (process.env.REQUESTED_IMAGE || 'all');
          if (!['all', 'setup', 'media', ...images.map(item => item.name)].includes(image)) {
            throw new Error('Select a supported image to publish');
          }
          const include = images.filter(item => image === 'all' || item.name === image);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `image=${image}\nmatrix=${JSON.stringify({ include })}\n`);
          NODE

  publish:
    name: Publishing ${{ matrix.name }}
    needs: select
    if: needs.select.outputs.image != 'setup' && needs.select.outputs.image != 'media'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - name: Checking out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Preparing platform emulation
        uses: docker/setup-qemu-action@v4
      - name: Preparing image builder
        uses: docker/setup-buildx-action@v4
      - name: Signing into Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Building and publishing
        env:
          IMAGE_NAME: ${{ matrix.name }}
          BUILD_CONTEXT: ${{ matrix.context }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          BUILD_TARGET: ${{ matrix.target }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION:-${GITHUB_REF_NAME#v}}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Expected a release tag such as v0.1.2\n' >&2
            exit 1
          fi
          image="relayrtc/${IMAGE_NAME}:${version}"
          build_args=()
          if [ -n "$BUILD_TARGET" ]; then
            build_args+=(--target "$BUILD_TARGET")
          fi
          docker buildx build \
            --pull \
            --platform linux/amd64,linux/arm64 \
            "${build_args[@]}" \
            --file "$DOCKERFILE" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$version" \
            --tag "$image" \
            --push \
            "$BUILD_CONTEXT"

  media:
    name: Publishing media (${{ matrix.arch }})
    needs: select
    if: needs.select.outputs.image == 'all' || needs.select.outputs.image == 'media'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    outputs:
      version: ${{ steps.release.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checking out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Preparing image builder
        uses: docker/setup-buildx-action@v4
      - name: Signing into Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Selecting the matching release
        id: release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION:-${GITHUB_REF_NAME#v}}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Building and publishing the native media image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infrastructure/docker/media.Dockerfile
          target: runner
          platforms: ${{ matrix.platform }}
          push: true
          tags: relayrtc/media:${{ steps.release.outputs.version }}-${{ matrix.arch }}-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}

  media-manifest:
    name: Publishing media multi-platform manifest
    needs: media
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Preparing image builder
        uses: docker/setup-buildx-action@v4
      - name: Signing into Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Combining the native images
        env:
          RELEASE_VERSION: ${{ needs.media.outputs.version }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            exit 1
          fi
          docker buildx imagetools create \
            --tag "relayrtc/media:${RELEASE_VERSION}" \
            "relayrtc/media:${RELEASE_VERSION}-amd64-${SOURCE_REVISION}" \
            "relayrtc/media:${RELEASE_VERSION}-arm64-${SOURCE_REVISION}"

  setup:
    name: Publishing setup
    needs: [select, publish, media-manifest]
    if: >-
      always() && !cancelled() && needs.select.result == 'success' &&
      (needs.select.outputs.image == 'setup' ||
      (needs.select.outputs.image == 'all' &&
      needs.publish.result == 'success' && needs.media-manifest.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checking out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Preparing platform emulation
        uses: docker/setup-qemu-action@v4
      - name: Preparing image builder
        uses: docker/setup-buildx-action@v4
      - name: Signing into Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Selecting the matching release
        id: release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION:-${GITHUB_REF_NAME#v}}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Publishing the installer
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infrastructure/docker/setup.Dockerfile
          target: runner
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            relayrtc/relayrtc:${{ steps.release.outputs.version }}
            relayrtc/relayrtc:latest
          build-args: RELAYRTC_VERSION=${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
