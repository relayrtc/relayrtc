name: Publish container images

on:
  workflow_dispatch:
    inputs:
      version:
        description: Image version to publish from the selected branch
        required: true
        default: "0.1.3"
        type: string
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publishing ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: api
            context: .
            dockerfile: infrastructure/docker/api.Dockerfile
            target: runner
          - name: signaling
            context: ./services/signaling
            dockerfile: services/signaling/Dockerfile
            target: ""
          - name: media
            context: .
            dockerfile: infrastructure/docker/media.Dockerfile
            target: runner
          - name: streaming
            context: .
            dockerfile: infrastructure/docker/streaming.Dockerfile
            target: runner
          - name: streaming-storage
            context: .
            dockerfile: infrastructure/docker/streaming-storage.Dockerfile
            target: runner
          - name: streaming-storage-init
            context: .
            dockerfile: infrastructure/docker/streaming-storage.Dockerfile
            target: storage-init
          - name: console
            context: .
            dockerfile: infrastructure/docker/console.Dockerfile
            target: runner
          - name: migrate
            context: .
            dockerfile: infrastructure/docker/migrate.Dockerfile
            target: migrator
          - name: coturn
            context: .
            dockerfile: infrastructure/docker/coturn.Dockerfile
            target: ""
          - name: prometheus
            context: .
            dockerfile: infrastructure/docker/prometheus.Dockerfile
            target: ""
          - name: grafana
            context: .
            dockerfile: infrastructure/docker/grafana.Dockerfile
            target: ""
    steps:
      - name: Checking out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Preparing platform emulation
        uses: docker/setup-qemu-action@v4
      - name: Preparing image builder
        uses: docker/setup-buildx-action@v4
      - name: Signing into GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Building and publishing
        env:
          IMAGE_NAME: ${{ matrix.name }}
          BUILD_CONTEXT: ${{ matrix.context }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          BUILD_TARGET: ${{ matrix.target }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION:-${GITHUB_REF_NAME#v}}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Expected a release tag such as v0.1.2\n' >&2
            exit 1
          fi
          image="ghcr.io/relayrtc/${IMAGE_NAME}:${version}"
          build_args=()
          if [ -n "$BUILD_TARGET" ]; then
            build_args+=(--target "$BUILD_TARGET")
          fi
          docker buildx build \
            --pull \
            --platform linux/amd64,linux/arm64 \
            "${build_args[@]}" \
            --file "$DOCKERFILE" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$version" \
            --tag "$image" \
            --push \
            "$BUILD_CONTEXT"

  setup:
    name: Publishing setup after all application images
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checking out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Preparing platform emulation
        uses: docker/setup-qemu-action@v4
      - name: Preparing image builder
        uses: docker/setup-buildx-action@v4
      - name: Signing into GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Selecting the matching release
        id: release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION:-${GITHUB_REF_NAME#v}}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Publishing the installer
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infrastructure/docker/setup.Dockerfile
          target: runner
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/relayrtc/setup:${{ steps.release.outputs.version }}
          build-args: RELAYRTC_VERSION=${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
