name: relayrtc

services:
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    restart: unless-stopped
    environment:
      API_REQUESTS_PER_IP_PER_MINUTE: ${API_REQUESTS_PER_IP_PER_MINUTE:-600}
      API_REQUESTS_PER_KEY_PER_MINUTE: ${API_REQUESTS_PER_KEY_PER_MINUTE:-1200}
      API_REQUESTS_PER_PROJECT_PER_MINUTE: ${API_REQUESTS_PER_PROJECT_PER_MINUTE:-3000}
      API_REQUESTS_PER_ROOM_PER_MINUTE: ${API_REQUESTS_PER_ROOM_PER_MINUTE:-1200}
      API_LIMIT_TRACKED_SCOPES: ${API_LIMIT_TRACKED_SCOPES:-10000}
      API_REQUESTS_PER_NODE_PER_MINUTE: ${API_REQUESTS_PER_NODE_PER_MINUTE:-10000}
      API_MEDIA_REQUESTS_PER_NODE_PER_MINUTE: ${API_MEDIA_REQUESTS_PER_NODE_PER_MINUTE:-100000}
      API_MEDIA_REQUESTS_PER_IP_PER_MINUTE: ${API_MEDIA_REQUESTS_PER_IP_PER_MINUTE:-12000}
      API_HOST: 0.0.0.0
      API_LOG_LEVEL: ${API_LOG_LEVEL:-info}
      API_PORT: 8080
      USAGE_RETENTION_DAYS: ${USAGE_RETENTION_DAYS:-365}
      SKIP_EMAIL_VERIFICATION: ${SKIP_EMAIL_VERIFICATION:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL must be set in .env}
      RELAYRTC_ACCOUNT_API_ENABLED: "true"
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-http://localhost:3002,http://127.0.0.1:3002}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      API_TRUST_PROXY: ${API_TRUST_PROXY:-false}
      API_TRUSTED_PROXY_CIDRS: ${API_TRUSTED_PROXY_CIDRS:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-relaykit}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-relaykit}
      PARTICIPANT_TOKEN_AUDIENCE: ${PARTICIPANT_TOKEN_AUDIENCE:-relayrtc-realtime}
      PARTICIPANT_TOKEN_ISSUER: ${PARTICIPANT_TOKEN_ISSUER:-relayrtc-api}
      PARTICIPANT_TOKEN_KEY_ID: ${PARTICIPANT_TOKEN_KEY_ID:-participant-v1}
      NODE_ENV: production
      PARTICIPANT_TOKEN_SIGNING_SECRET: ${PARTICIPANT_TOKEN_SIGNING_SECRET:?PARTICIPANT_TOKEN_SIGNING_SECRET must be set in .env}
      RELAYRTC_INTERNAL_SECRET: ${RELAYRTC_INTERNAL_SECRET:?RELAYRTC_INTERNAL_SECRET must be set in .env}
      RELAYRTC_MEDIA_INTERNAL_URL: http://media:8082/internal/v1
      RELAYRTC_SIGNALING_INTERNAL_URL: http://signaling:8081/internal/v1
      TURN_CREDENTIAL_TTL_SECONDS: ${TURN_CREDENTIAL_TTL_SECONDS:-600}
      WEBHOOK_SIGNING_ENCRYPTION_KEY: ${WEBHOOK_SIGNING_ENCRYPTION_KEY:-}
      TURN_ACCOUNTING_LOG_DIRECTORY: /var/log/relayrtc-turn
      TURN_ACCOUNTING_METRICS_URL: http://coturn:9641/metrics
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:?TURN_SHARED_SECRET must be set in .env}
      TURN_STUN_URLS: ${TURN_STUN_URLS:-stun:localhost:3478}
      TURN_URLS: ${TURN_URLS:-turn:localhost:3478?transport=udp,turn:localhost:3478?transport=tcp,turns:localhost:5349?transport=tcp}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - 127.0.0.1:${API_PORT:-8080}:8080
    volumes:
      - turn-accounting:/var/log/relayrtc-turn:ro
    healthcheck:
      test:
        - CMD-SHELL
        - wget --quiet --spider http://127.0.0.1:8080/ready
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    init: true
    security_opt:
      - no-new-privileges:true
    networks:
      - relayrtc
    logging: &default-logging
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m

  console:
    build:
      context: .
      dockerfile: infrastructure/docker/console.Dockerfile
      target: runner
    restart: unless-stopped
    environment:
      RELAYRTC_API_URL: http://api:8080
    depends_on:
      api:
        condition: service_healthy
    ports:
      - 127.0.0.1:${CONSOLE_PORT:-3002}:3002
    healthcheck:
      test:
        - CMD-SHELL
        - wget --quiet --spider http://127.0.0.1:3002/api/health
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    init: true
    security_opt:
      - no-new-privileges:true
    networks:
      - relayrtc
    logging: *default-logging

  migrate:
    build:
      context: .
      dockerfile: infrastructure/docker/migrate.Dockerfile
      target: migrator
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-relaykit}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-relaykit}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    init: true
    security_opt:
      - no-new-privileges:true
    networks:
      - relayrtc
    logging: *default-logging

  signaling:
    build:
      context: ./services/signaling
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MEDIA_NODE_ID: ${MEDIA_NODE_ID:-media-local}
      DATABASE_URL: postgresql://${POSTGRES_USER:-relaykit}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-relaykit}
      RELAYRTC_MEDIA_INTERNAL_URL: http://media:8082/internal/v1
      RELAYRTC_SIGNALING_ADDRESS: :8081
      RELAYRTC_SIGNALING_MAX_CONNECTIONS: ${RELAYRTC_SIGNALING_MAX_CONNECTIONS:-4096}
      RELAYRTC_SIGNALING_MAX_CONNECTIONS_PER_IP: ${RELAYRTC_SIGNALING_MAX_CONNECTIONS_PER_IP:-128}
      RELAYRTC_SIGNALING_MAX_CONNECTIONS_PER_PROJECT: ${RELAYRTC_SIGNALING_MAX_CONNECTIONS_PER_PROJECT:-1024}
      RELAYRTC_SIGNALING_MAX_CONNECTIONS_PER_ROOM: ${RELAYRTC_SIGNALING_MAX_CONNECTIONS_PER_ROOM:-256}
      RELAYRTC_SIGNALING_CONNECTS_PER_IP_PER_MINUTE: ${RELAYRTC_SIGNALING_CONNECTS_PER_IP_PER_MINUTE:-120}
      RELAYRTC_SIGNALING_MESSAGES_PER_CONNECTION_PER_SECOND: ${RELAYRTC_SIGNALING_MESSAGES_PER_CONNECTION_PER_SECOND:-60}
      RELAYRTC_SIGNALING_MESSAGES_PER_IP_PER_SECOND: ${RELAYRTC_SIGNALING_MESSAGES_PER_IP_PER_SECOND:-600}
      RELAYRTC_SIGNALING_MESSAGES_PER_PROJECT_PER_SECOND: ${RELAYRTC_SIGNALING_MESSAGES_PER_PROJECT_PER_SECOND:-2000}
      RELAYRTC_SIGNALING_MESSAGES_PER_ROOM_PER_SECOND: ${RELAYRTC_SIGNALING_MESSAGES_PER_ROOM_PER_SECOND:-1000}
      RELAYRTC_SIGNALING_OUTBOUND_MESSAGES: ${RELAYRTC_SIGNALING_OUTBOUND_MESSAGES:-64}
      RELAYRTC_SIGNALING_OUTBOUND_BYTES: ${RELAYRTC_SIGNALING_OUTBOUND_BYTES:-2097152}
      RELAYRTC_SIGNALING_LIMIT_TRACKED_SCOPES: ${RELAYRTC_SIGNALING_LIMIT_TRACKED_SCOPES:-10000}
      RELAYRTC_SIGNALING_MESSAGES_PER_NODE_PER_SECOND: ${RELAYRTC_SIGNALING_MESSAGES_PER_NODE_PER_SECOND:-10000}
      RELAYRTC_SIGNALING_NODE_ID: signaling-1
      RELAYRTC_SIGNALING_ALLOWED_ORIGINS: ${RELAYRTC_SIGNALING_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3002,http://localhost:3005,http://127.0.0.1:3000,http://127.0.0.1:3002,http://127.0.0.1:3005}
      RELAYRTC_TRUSTED_PROXY_CIDRS: ${RELAYRTC_TRUSTED_PROXY_CIDRS:-}
      RELAYRTC_STORE_PARTICIPANT_IP: ${RELAYRTC_STORE_PARTICIPANT_IP:-false}
      RELAYRTC_LOCATION_RETENTION: ${RELAYRTC_LOCATION_RETENTION:-168h}
      RELAYRTC_IPINFO_TOKEN: ${RELAYRTC_IPINFO_TOKEN:-}
      RELAYRTC_SIGNALING_HEARTBEAT_INTERVAL: ${RELAYRTC_SIGNALING_HEARTBEAT_INTERVAL:-20s}
      RELAYRTC_SIGNALING_MAX_MESSAGE_BYTES: ${RELAYRTC_SIGNALING_MAX_MESSAGE_BYTES:-65536}
      RELAYRTC_SIGNALING_PONG_TIMEOUT: ${RELAYRTC_SIGNALING_PONG_TIMEOUT:-60s}
      RELAYRTC_SIGNALING_RECOVERY_TIMEOUT: ${RELAYRTC_SIGNALING_RECOVERY_TIMEOUT:-30s}
      RELAYRTC_SIGNALING_WRITE_TIMEOUT: ${RELAYRTC_SIGNALING_WRITE_TIMEOUT:-10s}
      PARTICIPANT_TOKEN_AUDIENCE: ${PARTICIPANT_TOKEN_AUDIENCE:-relayrtc-realtime}
      PARTICIPANT_TOKEN_ISSUER: ${PARTICIPANT_TOKEN_ISSUER:-relayrtc-api}
      PARTICIPANT_TOKEN_KEY_ID: ${PARTICIPANT_TOKEN_KEY_ID:-participant-v1}
      NODE_ENV: production
      PARTICIPANT_TOKEN_SIGNING_SECRET: ${PARTICIPANT_TOKEN_SIGNING_SECRET:?PARTICIPANT_TOKEN_SIGNING_SECRET must be set in .env}
      RELAYRTC_INTERNAL_SECRET: ${RELAYRTC_INTERNAL_SECRET:?RELAYRTC_INTERNAL_SECRET must be set in .env}
    depends_on:
      migrate:
        condition: service_completed_successfully
    init: true
    ports:
      - 127.0.0.1:${SIGNALING_PORT:-8081}:8081
    healthcheck:
      test:
        - CMD-SHELL
        - wget --quiet --spider http://127.0.0.1:8081/ready
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    networks:
      - relayrtc
    logging: *default-logging

  media:
    build:
      context: .
      dockerfile: infrastructure/docker/media.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-relaykit}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-relaykit}
      NODE_ENV: production
      MEDIA_MAX_PRODUCERS_PER_ROOM: ${MEDIA_MAX_PRODUCERS_PER_ROOM:-100}
      MEDIA_MAX_CONSUMERS_PER_ROOM: ${MEDIA_MAX_CONSUMERS_PER_ROOM:-600}
      MEDIA_MAX_TRANSPORTS_PER_PARTICIPANT: ${MEDIA_MAX_TRANSPORTS_PER_PARTICIPANT:-4}
      MEDIA_MAX_PRODUCERS_PER_PARTICIPANT: ${MEDIA_MAX_PRODUCERS_PER_PARTICIPANT:-4}
      MEDIA_MAX_CONSUMERS_PER_PARTICIPANT: ${MEDIA_MAX_CONSUMERS_PER_PARTICIPANT:-128}
      MEDIA_HOST: 0.0.0.0
      MEDIA_LOG_LEVEL: ${MEDIA_LOG_LEVEL:-info}
      MEDIA_MAX_ROOMS_PER_WORKER: ${MEDIA_MAX_ROOMS_PER_WORKER:-100}
      MEDIA_MAX_TRANSPORTS_PER_ROOM: ${MEDIA_MAX_TRANSPORTS_PER_ROOM:-200}
      MEDIA_NODE_ID: ${MEDIA_NODE_ID:-media-local}
      MEDIA_PORT: 8082
      MEDIA_RTC_ANNOUNCED_ADDRESS: ${MEDIA_RTC_ANNOUNCED_ADDRESS:-127.0.0.1}
      MEDIA_RTC_ADDITIONAL_ANNOUNCED_ADDRESSES: ${MEDIA_RTC_ADDITIONAL_ANNOUNCED_ADDRESSES:-172.30.0.10}
      MEDIA_RTC_LISTEN_IP: ${MEDIA_RTC_LISTEN_IP:-0.0.0.0}
      MEDIA_RTC_MAX_PORT: ${MEDIA_RTC_MAX_PORT:-40003}
      MEDIA_RTC_PORT: ${MEDIA_RTC_PORT:-40000}
      MEDIA_WORKERS: ${MEDIA_WORKERS:-1}
      RELAYRTC_INTERNAL_SECRET: ${RELAYRTC_INTERNAL_SECRET:?RELAYRTC_INTERNAL_SECRET must be set in .env}
      RELAYRTC_SIGNALING_INTERNAL_URL: http://signaling:8081/internal/v1
    init: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      signaling:
        condition: service_healthy
    ports:
      - 127.0.0.1:${MEDIA_PORT:-8082}:8082
      - ${MEDIA_RTC_PORT:-40000}-${MEDIA_RTC_MAX_PORT:-40003}:${MEDIA_RTC_PORT:-40000}-${MEDIA_RTC_MAX_PORT:-40003}/tcp
      - ${MEDIA_RTC_PORT:-40000}-${MEDIA_RTC_MAX_PORT:-40003}:${MEDIA_RTC_PORT:-40000}-${MEDIA_RTC_MAX_PORT:-40003}/udp
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:8082/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    networks:
      relayrtc:
      rtc-internal:
        ipv4_address: 172.30.0.10
    logging: *default-logging

  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-relaykit}
      POSTGRES_INITDB_ARGS: --data-checksums --encoding=UTF8
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_USER: ${POSTGRES_USER:-relaykit}
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    init: true
    security_opt:
      - no-new-privileges:true
    networks:
      - relayrtc
    logging: *default-logging

  coturn:
    build:
      context: .
      dockerfile: infrastructure/docker/coturn.Dockerfile
    restart: unless-stopped
    volumes:
      - turn-accounting:/var/log/relayrtc-turn
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --realm=${TURN_REALM:-relayrtc.local}
      - --static-auth-secret=${TURN_SHARED_SECRET:?TURN_SHARED_SECRET must be set in .env}
      - --external-ip=${TURN_PUBLIC_IP:-127.0.0.1}/${TURN_DOCKER_RELAY_ADDRESS:-172.30.0.11}
      - --min-port=${RTC_MIN_PORT:-49160}
      - --max-port=${RTC_MAX_PORT:-49200}
      - --cert=${TURN_TLS_CERT_FILE:-/etc/coturn/tls/tls.crt}
      - --pkey=${TURN_TLS_PRIVATE_KEY_FILE:-/etc/coturn/tls/tls.key}
    ports:
      - ${TURN_PORT:-3478}:3478/tcp
      - ${TURN_PORT:-3478}:3478/udp
      - ${TURN_TLS_PORT:-5349}:5349/tcp
      - ${RTC_MIN_PORT:-49160}-${RTC_MAX_PORT:-49200}:${RTC_MIN_PORT:-49160}-${RTC_MAX_PORT:-49200}/udp
    healthcheck:
      test:
        - CMD-SHELL
        - turnutils_stunclient -t 1000 -p 3478 127.0.0.1 >/dev/null 2>&1 && nc -z 127.0.0.1 3478 && nc -z 127.0.0.1 5349
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    init: true
    security_opt:
      - no-new-privileges:true
    networks:
      relayrtc:
      rtc-internal:
        ipv4_address: 172.30.0.11
    logging: *default-logging

  prometheus:
    build:
      context: .
      dockerfile: infrastructure/docker/prometheus.Dockerfile
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=1GB
      - --web.enable-lifecycle
    ports:
      - 127.0.0.1:${PROMETHEUS_PORT:-9090}:9090
    volumes:
      - prometheus-data:/prometheus
    healthcheck:
      test:
        - CMD-SHELL
        - wget --quiet --spider http://127.0.0.1:9090/-/ready
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    init: true
    security_opt:
      - no-new-privileges:true
    networks:
      relayrtc:
      rtc-internal:
    logging: *default-logging

  grafana:
    build:
      context: .
      dockerfile: infrastructure/docker/grafana.Dockerfile
    restart: unless-stopped
    environment:
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in .env}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - 127.0.0.1:${GRAFANA_PORT:-3000}:3000
    volumes:
      - grafana-data:/var/lib/grafana
    healthcheck:
      test:
        - CMD-SHELL
        - wget --quiet --spider http://127.0.0.1:3000/api/health
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    init: true
    security_opt:
      - no-new-privileges:true
    networks:
      - relayrtc
    logging: *default-logging

networks:
  relayrtc:
    driver: bridge
  rtc-internal:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  turn-accounting:
  postgres-data:
  prometheus-data:
  grafana-data:
